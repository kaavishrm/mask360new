# Netlify: import the repo, set the base directory to "magazine". This file does the rest.
[build]
  command = "pip install pillow && node build.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/carousels/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
