name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node website/build.mjs
        env:
          # Remove SITE_BASE once mask360.agency is attached as the custom domain.
          SITE_BASE: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
      - id: deployment
        uses: actions/deploy-pages@v4
